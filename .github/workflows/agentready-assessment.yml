# Runs AgentReady (https://agent-ready.dev) to score how well this repository
# supports AI agents, and posts the assessment to the pull request.
name: AgentReady Assessment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install AgentReady
        run: |
          pip install 'agentready==2.52.3'

      - name: Run AgentReady assessment
        run: |
          agentready assess .

      - name: Upload assessment reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentready-reports
          path: .agentready/
          retention-days: 30

      # Skip fork PRs - GITHUB_TOKEN lacks write access to the base repo.
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- agentready-assessment -->';
            const dir = '.agentready';

            let report = '';
            if (fs.existsSync(dir)) {
              const mdFiles = fs.readdirSync(dir).filter(f => f.toLowerCase().endsWith('.md'));
              report = mdFiles
                .map(f => fs.readFileSync(path.join(dir, f), 'utf8'))
                .join('\n\n---\n\n');
            }
            if (!report) {
              console.log('No AgentReady report found; skipping comment');
              return;
            }

            // GitHub comment bodies are capped at 65536 characters
            let body = marker + '\n\n' + report;
            if (body.length > 65000) {
              body = body.slice(0, 64500) + '\n\n_Report truncated. The full report is in the `agentready-reports` workflow artifact._';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(
              c => c.body && c.body.includes(marker) && c.user.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
