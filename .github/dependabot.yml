# Dependabot configuration:
# https://docs.github.com/en/code-security/dependabot/dependabot-updates/configuration-options-for-the-dependency-file

version: 2
updates:
  # Gradle dependencies (Kotlin ignored — IntelliJ Platform Gradle Plugin aligns it)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
